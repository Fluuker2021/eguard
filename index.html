<style>
:root{--bg:#1C3A64;--bg-2:#2A548D;--card:#FFFFFF;--ink:#13233A;--ink-2:#4A5B71;--line:#C9D4E2;--brand:#2A548D;--brand-2:#4478BD;--light:#9DC7FF;--err:#C8102E;--err-soft:#F8DCE1;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A1424;--bg-2:#16294A;--card:#122036;--ink:#E2EAF5;--ink-2:#9DB0C8;--line:#2A4268;--brand:#4478BD;--brand-2:#6FA6E8;--err:#FF4D61;--err-soft:#3A1A22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--bg-2:#16294A;--card:#122036;--ink:#E2EAF5;--ink-2:#9DB0C8;--line:#2A4268;--brand:#4478BD;--brand-2:#6FA6E8;--err:#FF4D61;--err-soft:#3A1A22;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font:15px/1.45 "Titillium Web","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--bg-2) 0%,var(--bg) 62%);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff}
.brand img{width:44px;height:44px}
.brand span{font:700 38px/1 "Titillium Web",sans-serif;letter-spacing:-.01em}
.brand b{color:var(--light);font-weight:700}
form{background:var(--card);border-radius:6px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px #0006}
h1{margin:0 0 2px;font:700 19px/1.2 "Titillium Web",sans-serif}
label{display:flex;flex-direction:column;gap:5px;font:600 13px "Titillium Web",sans-serif;color:var(--ink-2)}
input{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:9px 11px;outline:none}
input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px #4478BD33}
.pw{position:relative;display:flex}
.pw input{flex:1;padding-right:44px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-2);width:36px;height:32px;cursor:pointer;display:grid;place-items:center;border-radius:4px}
.pw button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.go{margin-top:4px;border:0;border-radius:4px;background:var(--brand);color:#fff;font:700 15px "Titillium Web",sans-serif;padding:10px;cursor:pointer;letter-spacing:.02em}
.go:hover{background:var(--brand-2)}
.go:disabled{opacity:.7;cursor:wait}
.err{background:var(--err-soft);color:var(--err);border-radius:4px;padding:8px 10px;font-size:13.5px;font-weight:600}
.foot{text-align:center;color:#B9D3F5;font-size:12.5px}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
</style>
</head>

const SK = "eguard.session";
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (u) => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };

async function derive(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim().toLowerCase() + ":" + pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(PKG.salt), iterations: PKG.iter }, base, 256));
}
async function open(raw, blob) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(blob.iv) }, key, b64d(blob.ct));
  const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(ds).text();
}
async function launch(raw, user) {
  const html = await open(raw, PKG.app);
  const k = b64e(raw);
  // Datos de sesión para la consola; la clave solo vive en memoria y en sessionStorage de esta pestaña.
  window.EG_USER = user;
  window.EG_LOGOUT = () => { ss.del(SK); location.reload(); };
  window.EG_P3D = async () => {
    const r = await fetch(PKG.p3d, { cache: "force-cache" });
    if (!r.ok) throw new Error("p3d");
    return open(b64d(k), await r.json());
  };
  document.open(); document.write(html); document.close();
}

const saved = ss.get(SK);
if (saved) {
  try {
    const s = JSON.parse(saved);
    document.body.style.visibility = "hidden";
    launch(b64d(s.k), s.u).catch(() => { ss.del(SK); document.body.style.visibility = ""; });
  } catch (e) { ss.del(SK); }
}

const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go"), p = document.getElementById("p");
document.getElementById("eye").addEventListener("click", (e) => { const show = p.type === "password"; p.type = show ? "text" : "password"; e.currentTarget.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña"); });
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = document.getElementById("u").value, pw = p.value;
  err.hidden = true;
  if (!u.trim() || !pw) { err.textContent = "Ingresa usuario y contraseña."; err.hidden = false; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "Esta página requiere una conexión segura (HTTPS)."; err.hidden = false; return; }
  go.disabled = true; go.textContent = "Verificando…";
  try {
    const raw = await derive(u, pw);
    const name = JSON.parse(await open(raw, PKG.check)).u;
    ss.set(SK, JSON.stringify({ k: b64e(raw), u: name }));
    await launch(raw, name);
  } catch (ex) {
    go.disabled = false; go.textContent = "Ingresar";
    err.textContent = "Usuario o contraseña incorrectos."; err.hidden = false; p.select();
  }
});
})();
